<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="height: 280px;">
  <div style="display:flex; flex-direction:column; gap: 14px; max-width: 420px;">
    <!-- text input default -->
    <div>
      <label style="display:block; font-family: var(--font-mono); font-size:11px; letter-spacing: 0.12em; text-transform:uppercase; color:#6B6E76; margin-bottom:8px;">Name</label>
      <input value="" placeholder="Your name" style="width:100%; padding: 12px 14px; background:#14161A; border:1px solid rgba(255,255,255,0.08); border-radius: 8px; color:#F5F5F7; font-family: var(--font-body); font-size: 14px; outline:none; box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);"/>
    </div>
    <!-- text input focused -->
    <div>
      <label style="display:block; font-family: var(--font-mono); font-size:11px; letter-spacing: 0.12em; text-transform:uppercase; color:#A1A1A9; margin-bottom:8px;">Email · focused</label>
      <input value="you@domain.com" style="width:100%; padding: 12px 14px; background:#14161A; border:1px solid rgba(167,139,250,0.5); border-radius: 8px; color:#F5F5F7; font-family: var(--font-body); font-size: 14px; outline:none; box-shadow: 0 0 0 3px rgba(167,139,250,0.12), inset 0 1px 0 rgba(255,255,255,0.04);"/>
    </div>
    <!-- textarea -->
    <div>
      <label style="display:block; font-family: var(--font-mono); font-size:11px; letter-spacing: 0.12em; text-transform:uppercase; color:#6B6E76; margin-bottom:8px;">Message</label>
      <textarea style="width:100%; padding: 12px 14px; background:#14161A; border:1px solid rgba(255,255,255,0.08); border-radius: 8px; color:#F5F5F7; font-family: var(--font-body); font-size: 14px; outline:none; resize:none; height: 60px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);" placeholder="Tell me about the project…"></textarea>
    </div>
  </div>
</div>
</body></html>
