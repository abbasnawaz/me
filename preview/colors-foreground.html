<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="height: 240px;">
  <div class="grid" style="grid-template-columns: repeat(4, 1fr); gap: 16px;">
    <div>
      <div class="swatch tall" style="background:#F5F5F7;"></div>
      <div class="swatch-label"><span class="name">fg-primary</span><span class="val">#F5F5F7</span></div>
    </div>
    <div>
      <div class="swatch tall" style="background:#A1A1A9;"></div>
      <div class="swatch-label"><span class="name">fg-secondary</span><span class="val">#A1A1A9</span></div>
    </div>
    <div>
      <div class="swatch tall" style="background:#6B6E76;"></div>
      <div class="swatch-label"><span class="name">fg-tertiary</span><span class="val">#6B6E76</span></div>
    </div>
    <div>
      <div class="swatch tall" style="background:#4A4D54;"></div>
      <div class="swatch-label"><span class="name">fg-disabled</span><span class="val">#4A4D54</span></div>
    </div>
  </div>
  <div style="margin-top: 20px; display: flex; align-items: baseline; gap: 24px; padding: 16px 0 0; border-top: 1px solid var(--border-default);">
    <span style="color:#F5F5F7; font-size: 22px; letter-spacing: -0.02em;">Primary</span>
    <span style="color:#A1A1A9; font-size: 16px;">Secondary body</span>
    <span style="color:#6B6E76; font-size: 13px; font-family: var(--font-mono);">tertiary · meta</span>
  </div>
</div>
</body></html>
