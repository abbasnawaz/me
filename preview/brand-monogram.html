<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="height: 220px;">
  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap: 16px; align-items:center;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:10px; padding: 18px; background:#0E0F12; border:1px solid rgba(255,255,255,0.06); border-radius:12px;">
      <svg width="72" height="72" viewBox="0 0 64 64" fill="none" stroke="#F5F5F7" stroke-width="2.4"><path d="M8 52 L20 12 L32 52"/><path d="M13 36 L27 36"/><path d="M40 52 L40 12"/><path d="M56 52 L56 12"/><path d="M40 12 L56 52"/></svg>
      <span style="font-family: var(--font-mono); font-size: 10px; color: #6B6E76; letter-spacing: 0.1em;">MONOGRAM</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:10px; padding: 18px; background:#0E0F12; border:1px solid rgba(255,255,255,0.06); border-radius:12px;">
      <svg width="72" height="72" viewBox="0 0 64 64" fill="none">
        <defs>
          <linearGradient id="ir" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#A78BFA"/><stop offset="55%" stop-color="#67E8F9"/><stop offset="100%" stop-color="#FDE68A"/>
          </linearGradient>
        </defs>
        <g stroke="url(#ir)" stroke-width="2.4" fill="none"><path d="M8 52 L20 12 L32 52"/><path d="M13 36 L27 36"/><path d="M40 52 L40 12"/><path d="M56 52 L56 12"/><path d="M40 12 L56 52"/></g>
      </svg>
      <span style="font-family: var(--font-mono); font-size: 10px; color: #6B6E76; letter-spacing: 0.1em;">IRIDESCENT</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:10px; padding: 18px; background:#F5F5F7; border:1px solid rgba(0,0,0,0.06); border-radius:12px;">
      <svg width="72" height="72" viewBox="0 0 64 64" fill="none" stroke="#08090B" stroke-width="2.4"><path d="M8 52 L20 12 L32 52"/><path d="M13 36 L27 36"/><path d="M40 52 L40 12"/><path d="M56 52 L56 12"/><path d="M40 12 L56 52"/></svg>
      <span style="font-family: var(--font-mono); font-size: 10px; color: #6B6E76; letter-spacing: 0.1em;">INVERSE</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-start; gap:8px; padding: 18px; background:#0E0F12; border:1px solid rgba(255,255,255,0.06); border-radius:12px;">
      <span style="font-size: 22px; color:#F5F5F7; letter-spacing: -0.02em; font-weight: 500;">Abbas Nawaz</span>
      <span style="font-family: var(--font-mono); font-size: 10px; color: #6B6E76; letter-spacing: 0.1em;">WORDMARK · GEIST 500</span>
    </div>
  </div>
</div>
</body></html>
