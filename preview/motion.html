<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="height: 200px;">
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
    <div>
      <div style="font-family: var(--font-mono); font-size:11px; color:#6B6E76; letter-spacing:0.18em; text-transform:uppercase; margin-bottom:14px;">Easing curves</div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <div style="display:flex; align-items:center; gap:12px;">
          <svg width="60" height="24" viewBox="0 0 60 24"><path d="M0 22 C 10 22 18 2 60 2" stroke="#A78BFA" fill="none" stroke-width="1.5"/></svg>
          <span style="font-family: var(--font-mono); font-size:11px; color:#F5F5F7;">ease-out-expo</span>
          <span style="font-family: var(--font-mono); font-size:11px; color:#6B6E76;">default</span>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <svg width="60" height="24" viewBox="0 0 60 24"><path d="M0 22 C 24 22 36 2 60 2" stroke="#67E8F9" fill="none" stroke-width="1.5"/></svg>
          <span style="font-family: var(--font-mono); font-size:11px; color:#F5F5F7;">ease-in-out</span>
          <span style="font-family: var(--font-mono); font-size:11px; color:#6B6E76;">micro</span>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <svg width="60" height="24" viewBox="0 0 60 24"><path d="M0 22 C 13 22 22 2 60 2" stroke="#FDE68A" fill="none" stroke-width="1.5"/></svg>
          <span style="font-family: var(--font-mono); font-size:11px; color:#F5F5F7;">natural</span>
          <span style="font-family: var(--font-mono); font-size:11px; color:#6B6E76;">entrance</span>
        </div>
      </div>
    </div>
    <div>
      <div style="font-family: var(--font-mono); font-size:11px; color:#6B6E76; letter-spacing:0.18em; text-transform:uppercase; margin-bottom:14px;">Durations</div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <div style="display:flex; align-items:center; gap:12px;"><span style="height:4px; width:18px; background:#F5F5F7; border-radius:2px;"></span><span style="font-family: var(--font-mono); font-size:11px; color:#F5F5F7;">150ms · micro</span></div>
        <div style="display:flex; align-items:center; gap:12px;"><span style="height:4px; width:36px; background:#F5F5F7; border-radius:2px;"></span><span style="font-family: var(--font-mono); font-size:11px; color:#F5F5F7;">280ms · default</span></div>
        <div style="display:flex; align-items:center; gap:12px;"><span style="height:4px; width:80px; background:#F5F5F7; border-radius:2px;"></span><span style="font-family: var(--font-mono); font-size:11px; color:#F5F5F7;">600ms · entrance</span></div>
        <div style="display:flex; align-items:center; gap:12px;"><span style="height:4px; width:120px; background:#F5F5F7; border-radius:2px;"></span><span style="font-family: var(--font-mono); font-size:11px; color:#F5F5F7;">900ms · slow</span></div>
      </div>
    </div>
  </div>
</div>
</body></html>
