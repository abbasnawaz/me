<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="height: 180px;">
  <div class="grid" style="grid-template-columns: repeat(4, 1fr); gap: 16px;">
    <div style="display:flex; align-items:center; gap: 10px; padding: 14px 16px; background: var(--bg-elevated); border: 1px solid var(--border-default); border-radius: 10px;">
      <span style="width:8px; height:8px; border-radius:999px; background:#34D399; box-shadow: 0 0 12px #34D399aa;"></span>
      <div>
        <div style="font-size:12px; color:#F5F5F7;">success</div>
        <div style="font-family: var(--font-mono); font-size:10px; color:#6B6E76;">#34D399</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap: 10px; padding: 14px 16px; background: var(--bg-elevated); border: 1px solid var(--border-default); border-radius: 10px;">
      <span style="width:8px; height:8px; border-radius:999px; background:#FBBF24; box-shadow: 0 0 12px #FBBF24aa;"></span>
      <div>
        <div style="font-size:12px; color:#F5F5F7;">warning</div>
        <div style="font-family: var(--font-mono); font-size:10px; color:#6B6E76;">#FBBF24</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap: 10px; padding: 14px 16px; background: var(--bg-elevated); border: 1px solid var(--border-default); border-radius: 10px;">
      <span style="width:8px; height:8px; border-radius:999px; background:#F87171; box-shadow: 0 0 12px #F87171aa;"></span>
      <div>
        <div style="font-size:12px; color:#F5F5F7;">error</div>
        <div style="font-family: var(--font-mono); font-size:10px; color:#6B6E76;">#F87171</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap: 10px; padding: 14px 16px; background: var(--bg-elevated); border: 1px solid var(--border-default); border-radius: 10px;">
      <span style="width:8px; height:8px; border-radius:999px; background:#60A5FA; box-shadow: 0 0 12px #60A5FAaa;"></span>
      <div>
        <div style="font-size:12px; color:#F5F5F7;">info</div>
        <div style="font-family: var(--font-mono); font-size:10px; color:#6B6E76;">#60A5FA</div>
      </div>
    </div>
  </div>
  <div style="margin-top: 18px; display: flex; align-items: center; gap: 10px; color: #A1A1A9; font-size: 13px;">
    <span style="width:6px; height:6px; border-radius:999px; background:#34D399; display:inline-block;"></span>
    Available for new work
    <span style="color: #4A4D54; margin: 0 8px;">·</span>
    <span style="font-family: var(--font-mono); font-size:11px; color: #6B6E76;">used as 1px dots only — never as fills</span>
  </div>
</div>
</body></html>
