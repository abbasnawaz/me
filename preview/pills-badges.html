<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="height: 200px;">
  <div style="display:flex; flex-direction:column; gap:16px;">
    <!-- status pill -->
    <div>
      <span style="display:inline-flex; align-items:center; gap:8px; padding: 6px 12px 6px 10px; background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius: 999px; font-size:13px; color:#A1A1A9;">
        <span style="width:6px; height:6px; border-radius:999px; background:#34D399; box-shadow: 0 0 8px #34D399;"></span>
        Available for new work
      </span>
    </div>
    <!-- tech badges -->
    <div style="display:flex; gap: 8px; flex-wrap: wrap;">
      <span style="padding: 5px 11px; background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius: 999px; font-family: var(--font-mono); font-size:11px; color:#A1A1A9; letter-spacing: 0.02em;">Python</span>
      <span style="padding: 5px 11px; background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius: 999px; font-family: var(--font-mono); font-size:11px; color:#A1A1A9;">PyTorch</span>
      <span style="padding: 5px 11px; background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius: 999px; font-family: var(--font-mono); font-size:11px; color:#A1A1A9;">LangChain</span>
      <span style="padding: 5px 11px; background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius: 999px; font-family: var(--font-mono); font-size:11px; color:#A1A1A9;">FastAPI</span>
      <span style="padding: 5px 11px; background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius: 999px; font-family: var(--font-mono); font-size:11px; color:#A1A1A9;">Next.js</span>
      <span style="padding: 5px 11px; background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius: 999px; font-family: var(--font-mono); font-size:11px; color:#A1A1A9;">AWS</span>
      <span style="padding: 5px 11px; background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius: 999px; font-family: var(--font-mono); font-size:11px; color:#A1A1A9;">Docker</span>
    </div>
    <!-- eyebrow -->
    <div style="display:flex; gap: 18px; align-items:center;">
      <span style="font-family: var(--font-mono); font-size:11px; letter-spacing: 0.18em; text-transform:uppercase; color:#A1A1A9;">01 — Featured</span>
      <span style="font-family: var(--font-mono); font-size:11px; letter-spacing: 0.18em; text-transform:uppercase; color:#6B6E76;">02 — In progress</span>
    </div>
  </div>
</div>
</body></html>
