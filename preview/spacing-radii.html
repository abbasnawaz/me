<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="height: 200px;">
  <div style="display: flex; gap: 20px; align-items: flex-end;">
    <div style="text-align:center;">
      <div style="width:72px; height:72px; background:#14161A; border:1px solid var(--border-default); border-radius:4px; box-shadow: var(--inner-highlight);"></div>
      <div class="swatch-label" style="justify-content:center; gap:6px;"><span class="val">4 · xs</span></div>
    </div>
    <div style="text-align:center;">
      <div style="width:72px; height:72px; background:#14161A; border:1px solid var(--border-default); border-radius:8px; box-shadow: var(--inner-highlight);"></div>
      <div class="swatch-label" style="justify-content:center; gap:6px;"><span class="val">8 · sm</span></div>
    </div>
    <div style="text-align:center;">
      <div style="width:72px; height:72px; background:#14161A; border:1px solid var(--border-default); border-radius:12px; box-shadow: var(--inner-highlight);"></div>
      <div class="swatch-label" style="justify-content:center; gap:6px;"><span class="val">12 · md</span></div>
    </div>
    <div style="text-align:center;">
      <div style="width:72px; height:72px; background:#14161A; border:1px solid var(--border-default); border-radius:20px; box-shadow: var(--inner-highlight);"></div>
      <div class="swatch-label" style="justify-content:center; gap:6px;"><span class="val">20 · lg</span></div>
    </div>
    <div style="text-align:center;">
      <div style="width:72px; height:72px; background:#14161A; border:1px solid var(--border-default); border-radius:999px; box-shadow: var(--inner-highlight);"></div>
      <div class="swatch-label" style="justify-content:center; gap:6px;"><span class="val">∞ · pill</span></div>
    </div>
  </div>
</div>
</body></html>
