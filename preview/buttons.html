<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="height: 220px;">
  <div style="display:flex; flex-direction:column; gap:20px;">
    <div style="display:flex; gap: 14px; align-items:center; flex-wrap: wrap;">
      <!-- primary -->
      <button style="background:#F5F5F7; color:#08090B; border:none; padding: 12px 22px; border-radius: 8px; font-family: var(--font-body); font-size: 14px; font-weight: 500; letter-spacing: -0.005em; cursor:pointer; display:inline-flex; align-items:center; gap:8px; box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset;">
        View projects
        <span style="font-size: 13px;">↗</span>
      </button>
      <!-- secondary -->
      <button style="background:#14161A; color:#F5F5F7; border:1px solid rgba(255,255,255,0.12); padding: 11px 22px; border-radius: 8px; font-family: var(--font-body); font-size: 14px; font-weight: 500; cursor:pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);">
        Contact me
      </button>
      <!-- ghost -->
      <button style="background:transparent; color:#A1A1A9; border:none; padding: 11px 18px; font-family: var(--font-body); font-size: 14px; cursor:pointer;">
        Download résumé
      </button>
      <!-- icon -->
      <button aria-label="github" style="width:40px; height:40px; background:#14161A; border:1px solid rgba(255,255,255,0.06); border-radius: 8px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A1A1A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
      </button>
    </div>
    <div style="display:flex; gap: 14px; align-items:center; flex-wrap: wrap;">
      <button style="background:#F5F5F7; color:#08090B; border:none; padding: 12px 22px; border-radius: 8px; font-family: var(--font-body); font-size: 14px; font-weight: 500; opacity: 0.85; transform: scale(0.98); cursor:pointer; display:inline-flex; align-items:center; gap:8px;">
        Hover state ↗
      </button>
      <button style="background:#1A1D22; color:#F5F5F7; border:1px solid rgba(255,255,255,0.18); padding: 11px 22px; border-radius: 8px; font-family: var(--font-body); font-size: 14px; font-weight: 500;">
        Hover state
      </button>
      <span style="font-family: var(--font-mono); font-size: 11px; color: #6B6E76; letter-spacing: 0.05em;">→ scale(0.98) on press · 80ms</span>
    </div>
  </div>
</div>
</body></html>
