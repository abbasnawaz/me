<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="height: 280px;">
  <div style="width: 100%; height: 100px; border-radius: 14px; background: linear-gradient(135deg, #A78BFA 0%, #67E8F9 55%, #FDE68A 100%); position: relative; overflow: hidden;">
    <div style="position:absolute; inset:0; background: radial-gradient(circle at 30% 60%, rgba(255,255,255,0.25), transparent 60%);"></div>
  </div>
  <div class="swatch-label" style="margin-bottom: 16px;">
    <span class="name">gradient-spectrum · iridescent</span>
    <span class="val">violet → cyan → amber</span>
  </div>
  <div class="grid" style="grid-template-columns: repeat(3, 1fr); gap: 14px;">
    <div>
      <div style="height:64px; border-radius:10px; background:#A78BFA; box-shadow: var(--inner-highlight);"></div>
      <div class="swatch-label"><span class="name">accent-violet</span><span class="val">#A78BFA</span></div>
    </div>
    <div>
      <div style="height:64px; border-radius:10px; background:#67E8F9; box-shadow: var(--inner-highlight);"></div>
      <div class="swatch-label"><span class="name">accent-cyan</span><span class="val">#67E8F9</span></div>
    </div>
    <div>
      <div style="height:64px; border-radius:10px; background:#FDE68A; box-shadow: var(--inner-highlight);"></div>
      <div class="swatch-label"><span class="name">accent-amber</span><span class="val">#FDE68A</span></div>
    </div>
  </div>
</div>
</body></html>
