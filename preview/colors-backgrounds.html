<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="height: 220px;">
  <div class="grid" style="grid-template-columns: repeat(4, 1fr); gap: 16px;">
    <div>
      <div class="swatch tall" style="background:#08090B;"></div>
      <div class="swatch-label"><span class="name">bg-base</span><span class="val">#08090B</span></div>
    </div>
    <div>
      <div class="swatch tall" style="background:#0E0F12;"></div>
      <div class="swatch-label"><span class="name">bg-elevated</span><span class="val">#0E0F12</span></div>
    </div>
    <div>
      <div class="swatch tall" style="background:#14161A;"></div>
      <div class="swatch-label"><span class="name">bg-surface</span><span class="val">#14161A</span></div>
    </div>
    <div>
      <div class="swatch tall" style="background:#1A1D22;"></div>
      <div class="swatch-label"><span class="name">bg-overlay</span><span class="val">#1A1D22</span></div>
    </div>
  </div>
</div>
</body></html>
