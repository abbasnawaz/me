<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="height: 220px;">
  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;">
    <div>
      <div style="height: 110px; background:#0E0F12; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);"></div>
      <div class="swatch-label"><span class="name">card (default)</span><span class="val">border + inset highlight</span></div>
    </div>
    <div>
      <div style="height: 110px; background:#0E0F12; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);"></div>
      <div class="swatch-label"><span class="name">elev-md</span><span class="val">modal / popover</span></div>
    </div>
    <div>
      <div style="height: 110px; background:#0E0F12; border: 1px solid rgba(167,139,250,0.3); border-radius: 12px; box-shadow: 0 0 24px rgba(167,139,250,0.20), inset 0 1px 0 rgba(255,255,255,0.06);"></div>
      <div class="swatch-label"><span class="name">glow-sm</span><span class="val">active accent</span></div>
    </div>
  </div>
</div>
</body></html>
